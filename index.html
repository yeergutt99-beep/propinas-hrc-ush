<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hard Rock Ushuaia | Control semanal de propinas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Hard Rock Ushuaia</h1>
        <p>Control de entrega de propinas</p>
      </div>
      <div class="session-panel">
        <label>
          Semana
          <input type="week" id="weekPicker" />
        </label>
        <label>
          Perfil
          <select id="roleSelect">
            <option value="admin">Admin</option>
            <option value="camarero">Camarero</option>
          </select>
        </label>
        <label>
          Usuario
          <select id="userSelect"></select>
        </label>
      </div>
    </header>

    <main>
      <section class="card">
        <div class="section-header">
          <h2>Checklist semanal</h2>
          <p>
            Un día queda <strong>completo</strong> cuando el camarero marca su estado y
            el admin confirma.
          </p>
        </div>
        <div class="table-wrap">
          <table id="checklistTable">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <div class="section-header">
          <h2>Personas pendientes por día</h2>
          <p>Vista general para todos los perfiles.</p>
        </div>
        <div id="pendingGrid" class="pending-grid"></div>
      </section>
    </main>

    <template id="dayCellTemplate">
      <div class="cell-content">
        <select class="waiter-status">
          <option value="">Sin marcar</option>
          <option value="Entregado">Entregado</option>
          <option value="Otro Area">Otro Area</option>
          <option value="S/N">S/N</option>
          <option value="Franco">Franco</option>
        </select>
        <label class="admin-check-label">
          <input type="checkbox" class="admin-check" />
          Aprobación admin
        </label>
        <span class="state-pill">Pendiente</span>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
